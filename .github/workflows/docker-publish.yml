name: Publish image to GHCR

on:
  push:
    branches: ["main", "master", "develop"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nattaphong-ru-dotcom/69-s3-app

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            aliases="latest"
          else
            tag="$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
            aliases=""
            if [ "$GITHUB_REF_NAME" = "$GITHUB_DEFAULT_BRANCH" ]; then
              aliases="latest"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "aliases=$aliases" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          # The bare `--` is required so npm forwards the flags to the script
          # instead of consuming them as npm's own options.
          args=(build:image:push -- --registry "$REGISTRY" --image "$IMAGE_NAME" --tag '${{ steps.tags.outputs.tag }}')
          if [ -n '${{ steps.tags.outputs.aliases }}' ]; then
            args+=(--alias '${{ steps.tags.outputs.aliases }}')
          fi
          npm run "${args[@]}"

      - name: Test image
        run: |
          docker run -d --name test-app -p 1337:1337 \
            -e APP_KEYS="test1,test2,test3,test4" \
            -e API_TOKEN_SALT=testtoken \
            -e ADMIN_JWT_SECRET=testadmin \
            -e TRANSFER_TOKEN_SALT=testtransfer \
            -e JWT_SECRET=testjwt \
            -e ENCRYPTION_KEY=0123456789abcdef0123456789abcdef \
            "$REGISTRY/$IMAGE_NAME:${{ steps.tags.outputs.tag }}"
          sleep 30
          curl -f http://localhost:1337/_health