name: Publish image to GHCR

on:
  push:
    branches: ["main", "master", "develop"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nattaphong-ru-dotcom/69-s3-app

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        shell: pwsh
        run: |
          $image = "${REGISTRY}/${IMAGE_NAME}"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
            echo "aliases=$image:latest" >> $env:GITHUB_OUTPUT
          else {
            $branch = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
            echo "tag=$branch" >> $env:GITHUB_OUTPUT
            $aliases = ""
            if ($env:GITHUB_REF_NAME -eq $env:GITHUB_DEFAULT_BRANCH) { $aliases = "$image:latest" }
            echo "aliases=$aliases" >> $env:GITHUB_OUTPUT
          }

      - name: Build and push
        shell: pwsh
        run: |
          $npmArgs = @(
            'run', 'build:image:push', '--',
            '--registry', '${REGISTRY}',
            '--image', '${IMAGE_NAME}',
            '--tag', '${{ steps.tags.outputs.tag }}'
          )
          if ('${{ steps.tags.outputs.aliases }}') {
            $npmArgs += @('--alias', '${{ steps.tags.outputs.aliases }}'.Split(':')[-1])
          }
          npm $npmArgs

      - name: Test image
        shell: pwsh
        run: |
          docker run -d --name test-app -p 1337:1337 `
            -e APP_KEYS="test1,test2,test3,test4" `
            -e API_TOKEN_SALT=testtoken `
            -e ADMIN_JWT_SECRET=testadmin `
            -e TRANSFER_TOKEN_SALT=testtransfer `
            -e JWT_SECRET=testjwt `
            -e ENCRYPTION_KEY=0123456789abcdef0123456789abcdef `
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.tag }}"
          Start-Sleep -Seconds 30
          curl.exe -f http://localhost:1337/_health